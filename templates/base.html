<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CareerLens AI{% endblock %}</title>
<meta name="description" content="{% block description %}CareerLens AI helps you review resumes, identify missing skills, and improve your job application documents.{% endblock %}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="/">CareerLens <span>AI</span></a>
  <nav>
    <a href="/features">Features</a>
    <a href="/how-it-works">How it works</a>
    <a href="/guides">Guides</a>
    <a class="nav-cta" href="/analyzer">Analyze Resume</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <div><strong>CareerLens AI</strong><p>Practical resume feedback for students and job seekers.</p></div>
  <div class="footer-links">
    <a href="/about">About</a><a href="/contact">Contact</a><a href="/faq">FAQ</a>
    <a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/disclaimer">Disclaimer</a>
  </div>
  <p class="muted">© 2026 CareerLens AI. All rights reserved.</p>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
